<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>

    <!-- TADS SDK Script -->
    <script src="https://w.tads.me/widget.js"></script>
</head>

<body style="text-align: center; font-family: sans-serif; padding-top: 50px;">

    <h2>Welcome to My Mini App</h2>
    <p>নিচের বাটনে চাপ দিয়ে এড দেখুন:</p>

    <!-- Ad Show Button -->
    <button onclick="showTadsAd()" style="padding: 12px 24px; font-size: 16px; background-color: #0088cc; color: white; border: none; border-radius: 8px; cursor: pointer;">
        Watch Ad
    </button>

    <!-- TADS Ad Container -->
    <div id="tads-container-12506" style="margin-top: 30px;"></div>

    <script>
      let adController;

      window.onload = function() {
        if (window.tads) {
          adController = window.tads.init({
            widgetId: 12506,
            type: 'static',
            debug: true,
            onClickReward: (adId) => console.log('Ad Clicked:', adId),
            onAdsNotFound: () => alert('বর্তমানে কোনো বিজ্ঞাপন ফাঁকা নেই, কিছুক্ষণ পর চেষ্টা করুন!')
          });

          adController.loadAd()
            .then(() => adController.showAd())
            .catch((err) => console.log("Ad Error:", err));
        }
      };

      function showTadsAd() {
        if (adController) {
          adController.showAd();
        } else {
          alert("অ্যাড লোড হচ্ছে, একটু অপেক্ষা করুন...");
        }
      }
    </script>

</body>
</html>
